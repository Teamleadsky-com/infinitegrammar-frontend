name: Claude SEO Assessment

on:
  workflow_dispatch:
    inputs:
      subject_id:
        description: "Assessment subject ID (batch or assessment item)"
        required: true
        type: string

      issue_number:
        description: "GitHub issue number used as the audit/result channel"
        required: true
        type: string

      mode:
        description: "Read-only assessment mode"
        required: true
        type: choice
        options:
          - applicability
          - investigation

      prompt:
        description: "Assessment prompt supplied by n8n"
        required: true
        type: string

      max_turns:
        description: "Maximum Claude Code turns. Policy value: 50."
        required: false
        default: "50"
        type: string

      model:
        description: "Claude model override"
        required: false
        default: "opus"
        type: string

      task_id:
        description: "Persisted seo_claude_tasks task ID (required for autonomous dispatches)"
        required: false
        default: ""
        type: string

      resume_session_id:
        description: "Claude session ID to resume after a rate-limit pause"
        required: false
        default: ""
        type: string

      resume_source_run_id:
        description: "GitHub Actions run containing the saved Claude session artifact"
        required: false
        default: ""
        type: string

      resume_artifact_name:
        description: "Saved Claude session artifact name"
        required: false
        default: ""
        type: string

      resume_generation:
        description: "Monotonic resume generation used to invalidate stale wake-ups"
        required: false
        default: "0"
        type: string

      dry_run:
        description: "Validate inputs without calling Claude"
        required: false
        default: true
        type: boolean

concurrency:
  group: claude-seo-assessment-${{ inputs.subject_id }}-${{ inputs.mode }}
  cancel-in-progress: false

env:
  SEO_AGENT_PROFILE_ID: "v1b-seo-skilled-p1"
  SEO_SKILLS_VERSION: "v2.2.4"
  SEO_SKILLS_SOURCE: "AgriciDaniel/claude-seo"
  SEO_SKILLS_RELEASE_COMMIT: "6b63c8bb7b2e8e4480060604555e3af629b54c2c"

jobs:
  validate-inputs:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      max_turns_arg: ${{ steps.prepare.outputs.max_turns_arg }}
      model_arg: ${{ steps.prepare.outputs.model_arg }}
      resume_arg: ${{ steps.prepare.outputs.resume_arg }}

    steps:
      - id: prepare
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MODEL: ${{ inputs.model }}
          RESUME_SESSION_ID: ${{ inputs.resume_session_id }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
          RESUME_ARTIFACT_NAME: ${{ inputs.resume_artifact_name }}
          RESUME_GENERATION: ${{ inputs.resume_generation }}
        run: |
          set -euo pipefail

          case "$MODE" in
            applicability|investigation)
              ;;
            *)
              echo "Invalid mode: $MODE" >&2
              exit 1
              ;;
          esac

          if ! [[ "$MAX_TURNS" =~ ^[0-9]+$ ]]; then
            echo "max_turns must be a positive integer" >&2
            exit 1
          fi

          if [ "$MAX_TURNS" -ne 50 ]; then
            echo "max_turns must be exactly 50 for all Claude assessment modes" >&2
            exit 1
          fi

          EFFECTIVE_MODEL="${MODEL:-opus}"

          case "$EFFECTIVE_MODEL" in
            opus|sonnet|haiku|fable|claude-*)
              ;;
            *)
              echo "Unsupported model: $EFFECTIVE_MODEL" >&2
              exit 1
              ;;
          esac

          RESUME_ARG=""
          if [ -n "$RESUME_SESSION_ID" ]; then
            if ! [[ "$RESUME_SESSION_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              echo "Invalid resume_session_id" >&2
              exit 1
            fi
            if ! [[ "$RESUME_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "resume_source_run_id is required and must be numeric when resuming" >&2
              exit 1
            fi
            if ! [[ "$RESUME_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "resume_artifact_name is required and contains unsupported characters" >&2
              exit 1
            fi
            if ! [[ "$RESUME_GENERATION" =~ ^[0-9]+$ ]]; then
              echo "resume_generation must be a non-negative integer" >&2
              exit 1
            fi
            RESUME_ARG="--resume $RESUME_SESSION_ID"
          elif [ -n "$RESUME_SOURCE_RUN_ID$RESUME_ARTIFACT_NAME" ]; then
            echo "resume_source_run_id/resume_artifact_name require resume_session_id" >&2
            exit 1
          fi

          echo "max_turns_arg=--max-turns $MAX_TURNS" >> "$GITHUB_OUTPUT"
          echo "model_arg=--model $EFFECTIVE_MODEL" >> "$GITHUB_OUTPUT"
          echo "resume_arg=$RESUME_ARG" >> "$GITHUB_OUTPUT"

  dry-run:
    needs: validate-inputs
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - run: echo "Read-only SEO assessment dry run accepted."

  assessment:
    needs: validate-inputs
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: read
      checks: read

    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download interrupted Claude session
        if: ${{ inputs.resume_session_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.resume_artifact_name }}
          path: ${{ runner.temp }}/claude-session-restore
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_source_run_id }}

      - name: Restore interrupted Claude session
        if: ${{ inputs.resume_session_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py restore \
            --session-id "${{ inputs.resume_session_id }}" \
            --input-dir "${RUNNER_TEMP}/claude-session-restore"

      - name: Prepare pinned Claude SEO marketplace
        shell: bash
        run: |
          set -euo pipefail

          MARKETPLACE_DIR="${RUNNER_TEMP}/claude-seo-marketplace"

          git clone \
            --quiet \
            --branch "${SEO_SKILLS_VERSION}" \
            --depth 1 \
            "https://github.com/${SEO_SKILLS_SOURCE}.git" \
            "${MARKETPLACE_DIR}"

          ACTUAL_COMMIT="$(git -C "${MARKETPLACE_DIR}" rev-parse HEAD)"

          if [ "${ACTUAL_COMMIT}" != "${SEO_SKILLS_RELEASE_COMMIT}" ]; then
            echo "Pinned Claude SEO release commit mismatch." >&2
            echo "Expected: ${SEO_SKILLS_RELEASE_COMMIT}" >&2
            echo "Actual:   ${ACTUAL_COMMIT}" >&2
            exit 1
          fi

          echo "Claude SEO marketplace verified:"
          echo "  version: ${SEO_SKILLS_VERSION}"
          echo "  commit:  ${ACTUAL_COMMIT}"

      - name: Run Claude read-only SEO assessment
        id: claude_assessment
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          plugin_marketplaces: |
            ${{ runner.temp }}/claude-seo-marketplace

          plugins: |
            claude-seo@agricidaniel-claude-seo

          additional_permissions: |
            actions: read
            checks: read

          prompt: |
            REPOSITORY: ${{ github.repository }}
            SUBJECT_ID: ${{ inputs.subject_id }}
            TASK_ID: ${{ inputs.task_id }}
            ISSUE_NUMBER: ${{ inputs.issue_number }}
            MODE: ${{ inputs.mode }}
            AGENT_PROFILE_ID: ${{ env.SEO_AGENT_PROFILE_ID }}
            SEO_SKILLS_ENABLED: true
            SEO_SKILLS_VERSION: ${{ env.SEO_SKILLS_VERSION }}
            SEO_SKILLS_SOURCE: ${{ env.SEO_SKILLS_SOURCE }}
            SEO_SKILLS_RELEASE_COMMIT: ${{ env.SEO_SKILLS_RELEASE_COMMIT }}

            You are running a READ-ONLY SEO Assessment / Discovery task.

            SEO SKILL POLICY:
            - Use the installed Claude SEO skills as specialist domain reference when relevant.
            - Repository evidence and the supplied immutable validation plan remain authoritative.
            - Do not broaden the supplied catalogue check into a whole-site SEO audit.
            - Do not rewrite, broaden, replace, or bypass the immutable validation/observation plan.
            - Do not invoke optional external SEO integrations, MCP services, network tools, plugin subagents, or plugin runtime/setup commands.
            - Do not run /seo setup or any claude-seo runtime command.

            NON-NEGOTIABLE SAFETY RULES:
            - Do not modify files.
            - Do not create or switch branches.
            - Do not create pull requests.
            - Do not commit or push.
            - Do not merge anything.
            - Do not run implementation commands.
            - Use repository evidence only to analyze the supplied assessment prompt.
            - Return only the structured result requested by the supplied contract.

            Assessment task instruction:
            ${{ inputs.resume_session_id != '' && 'Continue the interrupted assessment from the restored Claude session. The prior execution stopped only because a Claude usage/session limit was reached. Continue from the existing analysis and produce the originally requested final structured assessment result. Do not restart completed analysis.' || inputs.prompt }}

          claude_args: |
            ${{ needs.validate-inputs.outputs.max_turns_arg }}
            ${{ needs.validate-inputs.outputs.model_arg }}
            ${{ needs.validate-inputs.outputs.resume_arg }}
            --allowedTools "Read,Glob,Grep"

      - name: Classify Claude runtime outcome
        id: classify_runtime
        if: ${{ always() }}
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude_assessment.outputs.execution_file }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py classify \
            --execution-file "$EXECUTION_FILE" \
            --max-turns "$MAX_TURNS" \
            --json-output "${RUNNER_TEMP}/claude-runtime.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Package interrupted Claude session
        id: package_session
        if: ${{ always() && steps.classify_runtime.outputs.error_type == 'claude_rate_limit' && steps.classify_runtime.outputs.session_id != '' }}
        continue-on-error: true
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude_assessment.outputs.execution_file }}
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py package \
            --session-id "${{ steps.classify_runtime.outputs.session_id }}" \
            --execution-file "$EXECUTION_FILE" \
            --output-dir "${RUNNER_TEMP}/claude-session-package"

      - name: Upload interrupted Claude session
        id: upload_session
        if: ${{ always() && steps.package_session.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-${{ steps.classify_runtime.outputs.session_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-session-package
          retention-days: 14
          if-no-files-found: error

      - name: Post Claude assessment result to audit issue
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SUBJECT_ID: ${{ inputs.subject_id }}
          TASK_ID: ${{ inputs.task_id }}
          MODE: ${{ inputs.mode }}
          EXECUTION_FILE: ${{ steps.claude_assessment.outputs.execution_file }}
          RUNTIME_FILE: ${{ runner.temp }}/claude-runtime.json
          RUNTIME_ERROR_TYPE: ${{ steps.classify_runtime.outputs.error_type }}
          RATE_LIMIT_STATUS: ${{ steps.classify_runtime.outputs.rate_limit_status }}
          RATE_LIMIT_TYPE: ${{ steps.classify_runtime.outputs.rate_limit_type }}
          RESET_AT_EPOCH: ${{ steps.classify_runtime.outputs.reset_at_epoch }}
          RESET_AT: ${{ steps.classify_runtime.outputs.reset_at }}
          CLAUDE_SESSION_ID: ${{ steps.classify_runtime.outputs.session_id }}
          RESUME_GENERATION: ${{ inputs.resume_generation }}
          SESSION_UPLOAD_OUTCOME: ${{ steps.upload_session.outcome }}
          SESSION_ARTIFACT_NAME: claude-session-${{ steps.classify_runtime.outputs.session_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          STEP_OUTCOME: ${{ steps.claude_assessment.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail

          if [ "$RUNTIME_ERROR_TYPE" = "claude_rate_limit" ]; then
            COMMENT_FILE="$(mktemp)"
            RESUME_AVAILABLE="false"
            if [ "$SESSION_UPLOAD_OUTCOME" = "success" ]; then
              RESUME_AVAILABLE="true"
            fi
            DIAGNOSTIC_TEXT="$(python - "$RUNTIME_FILE" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(str(data.get('diagnostic_text') or 'Claude reported a usage/session limit.'))
          PY
            )"
            {
              echo "SEO_ASSESSMENT_CLAUDE_RESULT"
              echo
              echo "subject_id: $SUBJECT_ID"
              echo "task_id: $TASK_ID"
              echo "mode: $MODE"
              echo "outcome: paused"
              echo "error_type: claude_rate_limit"
              echo "rate_limit_status: ${RATE_LIMIT_STATUS:-rejected}"
              [ -z "${RATE_LIMIT_TYPE:-}" ] || echo "rate_limit_type: $RATE_LIMIT_TYPE"
              [ -z "${RESET_AT_EPOCH:-}" ] || [ "$RESET_AT_EPOCH" = "0" ] || echo "reset_at_epoch: $RESET_AT_EPOCH"
              [ -z "${RESET_AT:-}" ] || echo "reset_at: $RESET_AT"
              echo "session_id: $CLAUDE_SESSION_ID"
              echo "resume_generation: ${RESUME_GENERATION:-0}"
              echo "resume_available: $RESUME_AVAILABLE"
              if [ "$RESUME_AVAILABLE" = "true" ]; then
                echo "session_artifact: $SESSION_ARTIFACT_NAME"
              fi
              echo "source_run_id: $SOURCE_RUN_ID"
              echo "run: $RUN_URL"
              echo "agent_profile_id: $SEO_AGENT_PROFILE_ID"
              echo "seo_skills_enabled: true"
              echo "seo_skills_version: $SEO_SKILLS_VERSION"
              echo "seo_skills_source: $SEO_SKILLS_SOURCE"
              echo "seo_skills_release_commit: $SEO_SKILLS_RELEASE_COMMIT"
              echo
              printf '%s\n' "$DIAGNOSTIC_TEXT"
            } > "$COMMENT_FILE"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$COMMENT_FILE"
            exit 0
          fi

          RESULT_FILE="$(mktemp)"

          python - "$EXECUTION_FILE" "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          execution_file_value = str(sys.argv[1] or "").strip()
          result_file = pathlib.Path(sys.argv[2])

          result = ""
          turns = 0
          last_subtype = ""
          terminal_subtype = ""

          if execution_file_value:
              execution_file = pathlib.Path(execution_file_value)

              if execution_file.exists():
                  raw = execution_file.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )

                  events = []

                  try:
                      data = json.loads(raw)

                      if isinstance(data, list):
                          events = data

                      elif isinstance(data, dict):
                          events = [data]

                  except json.JSONDecodeError:
                      for line in raw.splitlines():
                          try:
                              item = json.loads(line)
                          except json.JSONDecodeError:
                              continue

                          if isinstance(item, dict):
                              events.append(item)

                  for item in events:
                      if not isinstance(item, dict):
                          continue

                      subtype = str(item.get("subtype") or "").strip()

                      if subtype:
                          last_subtype = subtype

                      if subtype == "error_max_turns":
                          terminal_subtype = subtype

                      try:
                          candidate_turns = int(
                              item.get("num_turns") or 0
                          )
                      except (TypeError, ValueError):
                          candidate_turns = 0

                      if candidate_turns > turns:
                          turns = candidate_turns

                      is_result_event = (
                          item.get("type") == "result"
                          or len(events) == 1
                      )

                      if not is_result_event:
                          continue

                      candidate_result = str(
                          item.get("result") or ""
                      )

                      is_error_result = (
                          bool(item.get("is_error"))
                          or subtype.startswith("error_")
                      )

                      if (
                          candidate_result.strip()
                          and not is_error_result
                      ):
                          # Keep the latest usable non-error final result.
                          # A later error_max_turns event must not erase it.
                          result = candidate_result

          result_file.write_text(
              json.dumps(
                  {
                      "result": result,
                      "turns": turns,
                      "subtype": terminal_subtype or last_subtype,
                  }
              ),
              encoding="utf-8",
          )
          PY

          RESULT_TEXT="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(str(data.get("result") or ""))
          PY
          )"

          TURNS="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(int(data.get("turns") or 0))
          PY
          )"

          SUBTYPE="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(str(data.get("subtype") or ""))
          PY
          )"

          COMMENT_FILE="$(mktemp)"

          {
            echo "SEO_ASSESSMENT_CLAUDE_RESULT"
            echo
            echo "subject_id: $SUBJECT_ID"
            echo "task_id: $TASK_ID"
            echo "mode: $MODE"
            echo "outcome: $STEP_OUTCOME"
            echo "run: $RUN_URL"
            echo "agent_profile_id: $SEO_AGENT_PROFILE_ID"
            echo "seo_skills_enabled: true"
            echo "seo_skills_version: $SEO_SKILLS_VERSION"
            echo "seo_skills_source: $SEO_SKILLS_SOURCE"
            echo "seo_skills_release_commit: $SEO_SKILLS_RELEASE_COMMIT"

            if [ -n "$(printf '%s' "$RESULT_TEXT" | tr -d '[:space:]')" ]; then
              # A usable result takes precedence over the action outcome
              # and over any later max-turn termination signal.
              echo
              printf '%s\n' "$RESULT_TEXT"

            elif [ "$SUBTYPE" = "error_max_turns" ] \
              || [ "${TURNS:-0}" -ge "$MAX_TURNS" ]; then

              echo "error_type: turn_limit_exhausted"
              echo "turns: $TURNS"
              echo "max_turns: $MAX_TURNS"
              echo
              echo "Claude reached the configured max_turns without producing a valid final assessment result."

            else
              echo "error_type: claude_execution_error"
              echo "turns: $TURNS"
              echo "max_turns: $MAX_TURNS"
              echo
              echo "Claude did not produce a usable final assessment result."
            fi
          } > "$COMMENT_FILE"

          gh issue comment \
            "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body-file "$COMMENT_FILE"
