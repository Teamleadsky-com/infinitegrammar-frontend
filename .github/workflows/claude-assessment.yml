name: Claude SEO Assessment

on:
  workflow_dispatch:
    inputs:
      subject_id:
        description: "Assessment subject ID (batch or assessment item)"
        required: true
        type: string

      issue_number:
        description: "GitHub issue number used as the audit/result channel"
        required: true
        type: string

      mode:
        description: "Read-only assessment mode"
        required: true
        type: choice
        options:
          - applicability
          - investigation

      prompt:
        description: "Assessment prompt supplied by n8n"
        required: true
        type: string

      max_turns:
        description: "Maximum Claude Code turns. Policy value: 50."
        required: false
        default: "50"
        type: string

      model:
        description: "Claude model override"
        required: false
        default: "opus"
        type: string

      dry_run:
        description: "Validate inputs without calling Claude"
        required: false
        default: true
        type: boolean

concurrency:
  group: claude-seo-assessment-${{ inputs.subject_id }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      max_turns_arg: ${{ steps.prepare.outputs.max_turns_arg }}
      model_arg: ${{ steps.prepare.outputs.model_arg }}

    steps:
      - id: prepare
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail

          case "$MODE" in
            applicability|investigation)
              ;;
            *)
              echo "Invalid mode: $MODE" >&2
              exit 1
              ;;
          esac

          if ! [[ "$MAX_TURNS" =~ ^[0-9]+$ ]]; then
            echo "max_turns must be a positive integer" >&2
            exit 1
          fi

          if [ "$MAX_TURNS" -ne 50 ]; then
            echo "max_turns must be exactly 50 for all Claude assessment modes" >&2
            exit 1
          fi

          EFFECTIVE_MODEL="${MODEL:-opus}"

          case "$EFFECTIVE_MODEL" in
            opus|sonnet|haiku|fable|claude-*)
              ;;
            *)
              echo "Unsupported model: $EFFECTIVE_MODEL" >&2
              exit 1
              ;;
          esac

          echo "max_turns_arg=--max-turns $MAX_TURNS" >> "$GITHUB_OUTPUT"
          echo "model_arg=--model $EFFECTIVE_MODEL" >> "$GITHUB_OUTPUT"

  dry-run:
    needs: validate-inputs
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - run: echo "Read-only SEO assessment dry run accepted."

  assessment:
    needs: validate-inputs
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: read
      checks: read

    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude read-only SEO assessment
        id: claude_assessment
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read
            checks: read

          prompt: |
            REPOSITORY: ${{ github.repository }}
            SUBJECT_ID: ${{ inputs.subject_id }}
            ISSUE_NUMBER: ${{ inputs.issue_number }}
            MODE: ${{ inputs.mode }}

            You are running a READ-ONLY SEO Assessment / Discovery task.

            NON-NEGOTIABLE SAFETY RULES:
            - Do not modify files.
            - Do not create or switch branches.
            - Do not create pull requests.
            - Do not commit or push.
            - Do not merge anything.
            - Do not run implementation commands.
            - Use repository evidence only to analyze the supplied assessment prompt.
            - Return only the structured result requested by the supplied contract.

            Assessment prompt:
            ${{ inputs.prompt }}

          claude_args: |
            ${{ needs.validate-inputs.outputs.max_turns_arg }}
            ${{ needs.validate-inputs.outputs.model_arg }}
            --allowedTools "Read,Glob,Grep"

      - name: Post Claude assessment result to audit issue
        if: ${{ always() && steps.claude_assessment.outputs.execution_file != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SUBJECT_ID: ${{ inputs.subject_id }}
          MODE: ${{ inputs.mode }}
          EXECUTION_FILE: ${{ steps.claude_assessment.outputs.execution_file }}
          STEP_OUTCOME: ${{ steps.claude_assessment.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail

          RESULT_FILE="$(mktemp)"

          python - "$EXECUTION_FILE" "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          execution_file = pathlib.Path(sys.argv[1])
          result_file = pathlib.Path(sys.argv[2])

          raw = execution_file.read_text(
              encoding="utf-8",
              errors="replace",
          )

          result = ""
          turns = 0

          def values(item):
              if not isinstance(item, dict):
                  return "", 0

              value = str(item.get("result") or "")

              try:
                  count = int(item.get("num_turns") or 0)
              except (TypeError, ValueError):
                  count = 0

              return value, count

          try:
              data = json.loads(raw)

              if isinstance(data, dict):
                  result, turns = values(data)

              elif isinstance(data, list):
                  for item in reversed(data):
                      if isinstance(item, dict) and item.get("type") == "result":
                          result, turns = values(item)
                          break

          except json.JSONDecodeError:
              parsed = []

              for line in raw.splitlines():
                  try:
                      item = json.loads(line)
                  except json.JSONDecodeError:
                      continue

                  if isinstance(item, dict):
                      parsed.append(item)

              for item in reversed(parsed):
                  if item.get("type") == "result":
                      result, turns = values(item)
                      break

              if turns == 0:
                  for item in reversed(parsed):
                      _, candidate_turns = values(item)

                      if candidate_turns:
                          turns = candidate_turns
                          break

          result_file.write_text(
              json.dumps({
                  "result": result,
                  "turns": turns,
              }),
              encoding="utf-8",
          )
          PY

          RESULT_TEXT="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          )

          print(str(data.get("result") or ""))
          PY
          )"

          TURNS="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          )

          print(int(data.get("turns") or 0))
          PY
          )"

          COMMENT_FILE="$(mktemp)"

          {
            echo "SEO_ASSESSMENT_CLAUDE_RESULT"
            echo
            echo "subject_id: $SUBJECT_ID"
            echo "mode: $MODE"
            echo "outcome: $STEP_OUTCOME"
            echo "run: $RUN_URL"

            if [ -n "$(printf '%s' "$RESULT_TEXT" | tr -d '[:space:]')" ]; then
              echo
              printf '%s\n' "$RESULT_TEXT"

            elif [ "${TURNS:-0}" -ge "$MAX_TURNS" ]; then
              echo "error_type: turn_limit_exhausted"
              echo "turns: $TURNS"
              echo "max_turns: $MAX_TURNS"
              echo
              echo "Claude reached the configured max_turns without producing a valid final assessment result."

            else
              echo "error_type: claude_execution_error"
              echo "turns: $TURNS"
              echo "max_turns: $MAX_TURNS"
              echo
              echo "Claude did not produce a usable final assessment result."
            fi
          } > "$COMMENT_FILE"

          gh issue comment \
            "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body-file "$COMMENT_FILE"
