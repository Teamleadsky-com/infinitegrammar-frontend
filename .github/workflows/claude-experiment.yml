name: Claude Experiment

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: "Experiment ID, for example PILOT-003"
        required: true
        type: string

      issue_number:
        description: "GitHub issue number used as the audit record"
        required: true
        type: string

      role:
        description: "Claude role to run"
        required: true
        type: choice
        options:
          - proposal
          - gatekeeper
          - implementation

      prompt:
        description: "Role-specific prompt supplied by n8n or a manual operator"
        required: true
        type: string

      max_turns:
        description: "Maximum Claude Code turns. Policy value: 50."
        required: false
        default: "50"
        type: string

      model:
        description: "Claude model override. Defaults to opus for all SEO autopilot roles."
        required: false
        default: "opus"
        type: string

      permission_profile:
        description: "Optional permission profile"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - conservative
          - implementation

      task_id:
        description: "Persisted seo_claude_tasks task ID (required for autonomous dispatches)"
        required: false
        default: ""
        type: string

      resume_session_id:
        description: "Claude session ID to resume after a rate-limit pause"
        required: false
        default: ""
        type: string

      resume_source_run_id:
        description: "GitHub Actions run containing the saved Claude session artifact"
        required: false
        default: ""
        type: string

      resume_artifact_name:
        description: "Saved Claude session artifact name"
        required: false
        default: ""
        type: string

      resume_generation:
        description: "Monotonic resume generation used to invalidate stale wake-ups"
        required: false
        default: "0"
        type: string

      dry_run:
        description: "Validate workflow inputs without calling Claude"
        required: false
        default: true
        type: boolean

concurrency:
  group: claude-experiment-${{ inputs.experiment_id }}-${{ inputs.role }}
  cancel-in-progress: false

env:
  SEO_AGENT_PROFILE_ID: "v1b-seo-skilled-p1"
  SEO_SKILLS_VERSION: "v2.2.4"
  SEO_SKILLS_SOURCE: "AgriciDaniel/claude-seo"
  SEO_SKILLS_RELEASE_COMMIT: "6b63c8bb7b2e8e4480060604555e3af629b54c2c"

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      max_turns_arg: ${{ steps.prepare.outputs.max_turns_arg }}
      model_arg: ${{ steps.prepare.outputs.model_arg }}
      effective_model: ${{ steps.prepare.outputs.effective_model }}
      resume_arg: ${{ steps.prepare.outputs.resume_arg }}

    steps:
      - name: Validate role, model rule, and prepare Claude arguments
        id: prepare
        shell: bash
        env:
          ROLE: ${{ inputs.role }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MODEL: ${{ inputs.model }}
          RESUME_SESSION_ID: ${{ inputs.resume_session_id }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
          RESUME_ARTIFACT_NAME: ${{ inputs.resume_artifact_name }}
          RESUME_GENERATION: ${{ inputs.resume_generation }}
        run: |
          set -euo pipefail

          case "$ROLE" in
            proposal|gatekeeper|implementation)
              ;;
            *)
              echo "Invalid role: $ROLE" >&2
              exit 1
              ;;
          esac

          if ! [[ "$MAX_TURNS" =~ ^[0-9]+$ ]]; then
            echo "max_turns must be a positive integer" >&2
            exit 1
          fi

          if [ "$MAX_TURNS" -ne 50 ]; then
            echo "max_turns must be exactly 50 for all Claude experiment roles" >&2
            exit 1
          fi

          EFFECTIVE_MODEL="${MODEL:-opus}"

          case "$EFFECTIVE_MODEL" in
            opus|sonnet|haiku|fable|claude-*)
              ;;
            *)
              echo "Unsupported model override: $EFFECTIVE_MODEL" >&2
              echo "Use a Claude Code model alias such as opus, sonnet, haiku, fable, or a full model ID beginning with claude-." >&2
              exit 1
              ;;
          esac

          RESUME_ARG=""
          if [ -n "$RESUME_SESSION_ID" ]; then
            if ! [[ "$RESUME_SESSION_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              echo "Invalid resume_session_id" >&2
              exit 1
            fi
            if ! [[ "$RESUME_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "resume_source_run_id is required and must be numeric when resuming" >&2
              exit 1
            fi
            if ! [[ "$RESUME_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "resume_artifact_name is required and contains unsupported characters" >&2
              exit 1
            fi
            if ! [[ "$RESUME_GENERATION" =~ ^[0-9]+$ ]]; then
              echo "resume_generation must be a non-negative integer" >&2
              exit 1
            fi
            RESUME_ARG="--resume $RESUME_SESSION_ID"
          elif [ -n "$RESUME_SOURCE_RUN_ID$RESUME_ARTIFACT_NAME" ]; then
            echo "resume_source_run_id/resume_artifact_name require resume_session_id" >&2
            exit 1
          fi

          echo "max_turns_arg=--max-turns $MAX_TURNS" >> "$GITHUB_OUTPUT"
          echo "model_arg=--model $EFFECTIVE_MODEL" >> "$GITHUB_OUTPUT"
          echo "effective_model=$EFFECTIVE_MODEL" >> "$GITHUB_OUTPUT"
          echo "resume_arg=$RESUME_ARG" >> "$GITHUB_OUTPUT"

      - name: Print dispatch summary
        shell: bash
        run: |
          cat <<'EOF'
          Claude experiment dispatch accepted.

          experiment_id:      ${{ inputs.experiment_id }}
          task_id:            ${{ inputs.task_id }}
          issue_number:       ${{ inputs.issue_number }}
          role:               ${{ inputs.role }}
          max_turns:          ${{ inputs.max_turns }}
          model input:        ${{ inputs.model }}
          effective model:    ${{ needs.validate-inputs.outputs.effective_model }}
          permission_profile: ${{ inputs.permission_profile }}
          dry_run:            ${{ inputs.dry_run }}
          agent profile:      ${{ env.SEO_AGENT_PROFILE_ID }}
          SEO skills bundle:  ${{ env.SEO_SKILLS_SOURCE }} ${{ env.SEO_SKILLS_VERSION }}

          Model rule:
          - proposal, gatekeeper, and implementation default to opus
          - all roles may use the same explicit model override
          - all roles use max_turns = 50

          SEO skills policy:
          - proposal: enabled
          - gatekeeper: disabled for independent review
          - implementation: enabled

          The role-specific Claude jobs are skipped when dry_run=true.
          EOF

  dry-run:
    name: Dry run
    needs: validate-inputs
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Confirm dry run
        shell: bash
        run: |
          echo "Dry run complete. Claude was not called."

  proposal:
    name: Claude proposal role
    needs: validate-inputs
    if: ${{ inputs.dry_run != true && inputs.role == 'proposal' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: read
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download interrupted Claude session
        if: ${{ inputs.resume_session_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.resume_artifact_name }}
          path: ${{ runner.temp }}/claude-session-restore
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_source_run_id }}

      - name: Restore interrupted Claude session
        if: ${{ inputs.resume_session_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py restore \
            --session-id "${{ inputs.resume_session_id }}" \
            --input-dir "${RUNNER_TEMP}/claude-session-restore"

      - name: Prepare pinned Claude SEO marketplace
        shell: bash
        run: |
          set -euo pipefail

          MARKETPLACE_DIR="${RUNNER_TEMP}/claude-seo-marketplace"

          git clone \
            --quiet \
            --branch "${SEO_SKILLS_VERSION}" \
            --depth 1 \
            "https://github.com/${SEO_SKILLS_SOURCE}.git" \
            "${MARKETPLACE_DIR}"

          ACTUAL_COMMIT="$(git -C "${MARKETPLACE_DIR}" rev-parse HEAD)"

          if [ "${ACTUAL_COMMIT}" != "${SEO_SKILLS_RELEASE_COMMIT}" ]; then
            echo "Pinned Claude SEO release commit mismatch." >&2
            echo "Expected: ${SEO_SKILLS_RELEASE_COMMIT}" >&2
            echo "Actual:   ${ACTUAL_COMMIT}" >&2
            exit 1
          fi

          echo "Claude SEO marketplace verified:"
          echo "  version: ${SEO_SKILLS_VERSION}"
          echo "  commit:  ${ACTUAL_COMMIT}"

      - name: Run Claude proposal
        id: claude_proposal
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          plugin_marketplaces: |
            ${{ runner.temp }}/claude-seo-marketplace

          plugins: |
            claude-seo@agricidaniel-claude-seo

          additional_permissions: |
            actions: read
            checks: read

          prompt: |
            REPOSITORY: ${{ github.repository }}
            EXPERIMENT_ID: ${{ inputs.experiment_id }}
            TASK_ID: ${{ inputs.task_id }}
            ISSUE_NUMBER: ${{ inputs.issue_number }}
            ROLE: proposal
            PERMISSION_PROFILE: ${{ inputs.permission_profile }}
            AGENT_PROFILE_ID: ${{ env.SEO_AGENT_PROFILE_ID }}
            SEO_SKILLS_ENABLED: true
            SEO_SKILLS_VERSION: ${{ env.SEO_SKILLS_VERSION }}
            SEO_SKILLS_SOURCE: ${{ env.SEO_SKILLS_SOURCE }}
            SEO_SKILLS_RELEASE_COMMIT: ${{ env.SEO_SKILLS_RELEASE_COMMIT }}

            You are running the proposal role for the SEO autopilot system.

            SEO SKILL POLICY:
            - Use the installed Claude SEO skills as specialist domain reference when relevant.
            - Repository evidence and the supplied experiment/check remain authoritative.
            - Do not broaden the supplied issue into a general SEO audit.
            - Do not rewrite, broaden, replace, or bypass the immutable validation/observation plan.
            - The SEO skills may improve diagnosis and proposal quality but may not expand experiment scope.
            - Do not invoke optional external SEO integrations, MCP services, network tools, plugin subagents, or plugin runtime/setup commands.
            - Do not run /seo setup or any claude-seo runtime command.

            This role must analyze and propose only.
            Do not modify files.
            Do not create branches.
            Do not create pull requests.
            Do not merge anything.

            User/n8n task instruction:
            ${{ inputs.resume_session_id != '' && 'Continue the interrupted task from the restored Claude session. The prior execution stopped only because a Claude usage/session limit was reached. Continue from the existing work and produce the originally requested final role result. Do not restart completed analysis or implementation.' || inputs.prompt }}

          claude_args: |
            ${{ needs.validate-inputs.outputs.max_turns_arg }}
            ${{ needs.validate-inputs.outputs.model_arg }}
            ${{ needs.validate-inputs.outputs.resume_arg }}
            --allowedTools "Read,Glob,Grep"

      - name: Classify Claude proposal runtime outcome
        id: classify_proposal
        if: ${{ always() }}
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude_proposal.outputs.execution_file }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py classify \
            --execution-file "$EXECUTION_FILE" \
            --max-turns "$MAX_TURNS" \
            --json-output "${RUNNER_TEMP}/claude-runtime-proposal.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Package interrupted Claude proposal session
        id: package_proposal
        if: ${{ always() && steps.classify_proposal.outputs.error_type == 'claude_rate_limit' && steps.classify_proposal.outputs.session_id != '' }}
        continue-on-error: true
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude_proposal.outputs.execution_file }}
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py package \
            --session-id "${{ steps.classify_proposal.outputs.session_id }}" \
            --execution-file "$EXECUTION_FILE" \
            --output-dir "${RUNNER_TEMP}/claude-session-package-proposal"

      - name: Upload interrupted Claude proposal session
        id: upload_proposal
        if: ${{ always() && steps.package_proposal.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-${{ steps.classify_proposal.outputs.session_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-session-package-proposal
          retention-days: 14
          if-no-files-found: error

      - name: Post Claude proposal result to issue
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          TASK_ID: ${{ inputs.task_id }}
          ROLE_NAME: proposal
          STEP_OUTCOME: ${{ steps.claude_proposal.outcome }}
          EXECUTION_FILE: ${{ steps.claude_proposal.outputs.execution_file }}
          RUNTIME_FILE: ${{ runner.temp }}/claude-runtime-proposal.json
          RUNTIME_ERROR_TYPE: ${{ steps.classify_proposal.outputs.error_type }}
          RATE_LIMIT_STATUS: ${{ steps.classify_proposal.outputs.rate_limit_status }}
          RATE_LIMIT_TYPE: ${{ steps.classify_proposal.outputs.rate_limit_type }}
          RESET_AT_EPOCH: ${{ steps.classify_proposal.outputs.reset_at_epoch }}
          RESET_AT: ${{ steps.classify_proposal.outputs.reset_at }}
          CLAUDE_SESSION_ID: ${{ steps.classify_proposal.outputs.session_id }}
          RESUME_GENERATION: ${{ inputs.resume_generation }}
          SESSION_UPLOAD_OUTCOME: ${{ steps.upload_proposal.outcome }}
          SESSION_ARTIFACT_NAME: claude-session-${{ steps.classify_proposal.outputs.session_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail

          if [ "$RUNTIME_ERROR_TYPE" = "claude_rate_limit" ]; then
            BODY_FILE="$(mktemp)"
            RESUME_AVAILABLE="false"
            if [ "$SESSION_UPLOAD_OUTCOME" = "success" ]; then
              RESUME_AVAILABLE="true"
            fi
            DIAGNOSTIC_TEXT="$(python - "$RUNTIME_FILE" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(str(data.get('diagnostic_text') or 'Claude reported a usage/session limit.'))
          PY
            )"
            {
              echo "## CLAUDE_EXPERIMENT_ERROR"
              echo
              echo "experiment_id: $EXPERIMENT_ID"
              echo "task_id: $TASK_ID"
              echo "role: $ROLE_NAME"
              echo "workflow_run: $RUN_URL"
              echo "source_run_id: $SOURCE_RUN_ID"
              echo "step_outcome: $STEP_OUTCOME"
              echo "outcome: paused"
              echo "error_type: claude_rate_limit"
              echo "rate_limit_status: ${RATE_LIMIT_STATUS:-rejected}"
              [ -z "${RATE_LIMIT_TYPE:-}" ] || echo "rate_limit_type: $RATE_LIMIT_TYPE"
              [ -z "${RESET_AT_EPOCH:-}" ] || [ "$RESET_AT_EPOCH" = "0" ] || echo "reset_at_epoch: $RESET_AT_EPOCH"
              [ -z "${RESET_AT:-}" ] || echo "reset_at: $RESET_AT"
              echo "session_id: $CLAUDE_SESSION_ID"
              echo "resume_generation: ${RESUME_GENERATION:-0}"
              echo "resume_available: $RESUME_AVAILABLE"
              if [ "$RESUME_AVAILABLE" = "true" ]; then
                echo "session_artifact: $SESSION_ARTIFACT_NAME"
              fi
              echo
              echo "### Error"
              echo
              printf '%s\n' "$DIAGNOSTIC_TEXT"
            } > "$BODY_FILE"
            gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" -F body=@"$BODY_FILE"
            exit 0
          fi

          RESULT_FILE="$(mktemp)"

          python - "$EXECUTION_FILE" "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          execution_file_value = str(sys.argv[1] or "").strip()
          result_file = pathlib.Path(sys.argv[2])

          result = ""
          turns = 0
          last_subtype = ""
          terminal_subtype = ""

          if execution_file_value:
              execution_file = pathlib.Path(execution_file_value)

              if execution_file.exists():
                  raw = execution_file.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )

                  events = []

                  try:
                      data = json.loads(raw)

                      if isinstance(data, list):
                          events = data

                      elif isinstance(data, dict):
                          events = [data]

                  except json.JSONDecodeError:
                      for line in raw.splitlines():
                          try:
                              item = json.loads(line)
                          except json.JSONDecodeError:
                              continue

                          if isinstance(item, dict):
                              events.append(item)

                  for item in events:
                      if not isinstance(item, dict):
                          continue

                      subtype = str(item.get("subtype") or "").strip()

                      if subtype:
                          last_subtype = subtype

                      if subtype == "error_max_turns":
                          terminal_subtype = subtype

                      try:
                          candidate_turns = int(
                              item.get("num_turns") or 0
                          )
                      except (TypeError, ValueError):
                          candidate_turns = 0

                      if candidate_turns > turns:
                          turns = candidate_turns

                      is_result_event = (
                          item.get("type") == "result"
                          or len(events) == 1
                      )

                      if not is_result_event:
                          continue

                      candidate_result = str(
                          item.get("result") or ""
                      )

                      is_error_result = (
                          bool(item.get("is_error"))
                          or subtype.startswith("error_")
                      )

                      if (
                          candidate_result.strip()
                          and not is_error_result
                      ):
                          result = candidate_result

          result_file.write_text(
              json.dumps(
                  {
                      "result": result,
                      "turns": turns,
                      "subtype": terminal_subtype or last_subtype,
                  }
              ),
              encoding="utf-8",
          )
          PY

          RESULT_TEXT="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(str(data.get("result") or ""))
          PY
          )"

          TURNS="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(int(data.get("turns") or 0))
          PY
          )"

          SUBTYPE="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(str(data.get("subtype") or ""))
          PY
          )"

          if [ -n "$(printf '%s' "$RESULT_TEXT" | tr -d '[:space:]')" ]; then
            BODY="$(cat <<EOF
          ## CLAUDE_EXPERIMENT_RESULT

          experiment_id: $EXPERIMENT_ID
          task_id: $TASK_ID
          role: $ROLE_NAME
          workflow_run: $RUN_URL
          agent_profile_id: $SEO_AGENT_PROFILE_ID
          seo_skills_enabled: true
          seo_skills_version: $SEO_SKILLS_VERSION
          seo_skills_source: $SEO_SKILLS_SOURCE
          seo_skills_release_commit: $SEO_SKILLS_RELEASE_COMMIT

          ### Result

          $RESULT_TEXT
          EOF
          )"

          elif [ "$SUBTYPE" = "error_max_turns" ] \
            || [ "${TURNS:-0}" -ge "$MAX_TURNS" ]; then

            BODY="$(cat <<EOF
          ## CLAUDE_EXPERIMENT_ERROR

          experiment_id: $EXPERIMENT_ID
          task_id: $TASK_ID
          role: $ROLE_NAME
          workflow_run: $RUN_URL
          agent_profile_id: $SEO_AGENT_PROFILE_ID
          seo_skills_enabled: true
          seo_skills_version: $SEO_SKILLS_VERSION
          seo_skills_source: $SEO_SKILLS_SOURCE
          seo_skills_release_commit: $SEO_SKILLS_RELEASE_COMMIT
          step_outcome: $STEP_OUTCOME
          error_type: turn_limit_exhausted
          turns: $TURNS
          max_turns: $MAX_TURNS

          ### Error

          Claude reached the configured max_turns without producing a valid final result.
          EOF
          )"

          else
            BODY="$(cat <<EOF
          ## CLAUDE_EXPERIMENT_ERROR

          experiment_id: $EXPERIMENT_ID
          task_id: $TASK_ID
          role: $ROLE_NAME
          workflow_run: $RUN_URL
          agent_profile_id: $SEO_AGENT_PROFILE_ID
          seo_skills_enabled: true
          seo_skills_version: $SEO_SKILLS_VERSION
          seo_skills_source: $SEO_SKILLS_SOURCE
          seo_skills_release_commit: $SEO_SKILLS_RELEASE_COMMIT
          step_outcome: $STEP_OUTCOME
          error_type: claude_execution_error
          turns: $TURNS
          max_turns: $MAX_TURNS

          ### Error

          Claude did not produce a usable final result text. Do not treat this as a valid proposal, gatekeeper review, or implementation result.
          EOF
          )"
          fi

          gh api \
            -X POST \
            "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -f body="$BODY"

  gatekeeper:
    name: Claude gatekeeper role
    needs: validate-inputs
    if: ${{ inputs.dry_run != true && inputs.role == 'gatekeeper' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: read
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download interrupted Claude session
        if: ${{ inputs.resume_session_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.resume_artifact_name }}
          path: ${{ runner.temp }}/claude-session-restore
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_source_run_id }}

      - name: Restore interrupted Claude session
        if: ${{ inputs.resume_session_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py restore \
            --session-id "${{ inputs.resume_session_id }}" \
            --input-dir "${RUNNER_TEMP}/claude-session-restore"

      - name: Run Claude gatekeeper
        id: claude_gatekeeper
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read
            checks: read

          prompt: |
            REPOSITORY: ${{ github.repository }}
            EXPERIMENT_ID: ${{ inputs.experiment_id }}
            TASK_ID: ${{ inputs.task_id }}
            ISSUE_NUMBER: ${{ inputs.issue_number }}
            ROLE: gatekeeper
            PERMISSION_PROFILE: ${{ inputs.permission_profile }}
            AGENT_PROFILE_ID: ${{ env.SEO_AGENT_PROFILE_ID }}
            SEO_SKILLS_ENABLED: false
            SEO_SKILLS_VERSION: none

            You are running the gatekeeper role for the SEO autopilot system.

            INDEPENDENCE POLICY:
            - Claude SEO is intentionally not installed for this role.
            - Review the proposal independently from repository evidence and the supplied contract.
            - Do not assume that SEO-skill reasoning used upstream is correct.

            This role must independently review a proposal.
            Do not modify files.
            Do not create branches.
            Do not create pull requests.
            Do not merge anything.

            User/n8n task instruction:
            ${{ inputs.resume_session_id != '' && 'Continue the interrupted task from the restored Claude session. The prior execution stopped only because a Claude usage/session limit was reached. Continue from the existing work and produce the originally requested final role result. Do not restart completed analysis or implementation.' || inputs.prompt }}

          claude_args: |
            ${{ needs.validate-inputs.outputs.max_turns_arg }}
            ${{ needs.validate-inputs.outputs.model_arg }}
            ${{ needs.validate-inputs.outputs.resume_arg }}
            --allowedTools "Read,Glob,Grep"

      - name: Classify Claude gatekeeper runtime outcome
        id: classify_gatekeeper
        if: ${{ always() }}
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude_gatekeeper.outputs.execution_file }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py classify \
            --execution-file "$EXECUTION_FILE" \
            --max-turns "$MAX_TURNS" \
            --json-output "${RUNNER_TEMP}/claude-runtime-gatekeeper.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Package interrupted Claude gatekeeper session
        id: package_gatekeeper
        if: ${{ always() && steps.classify_gatekeeper.outputs.error_type == 'claude_rate_limit' && steps.classify_gatekeeper.outputs.session_id != '' }}
        continue-on-error: true
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude_gatekeeper.outputs.execution_file }}
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py package \
            --session-id "${{ steps.classify_gatekeeper.outputs.session_id }}" \
            --execution-file "$EXECUTION_FILE" \
            --output-dir "${RUNNER_TEMP}/claude-session-package-gatekeeper"

      - name: Upload interrupted Claude gatekeeper session
        id: upload_gatekeeper
        if: ${{ always() && steps.package_gatekeeper.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-${{ steps.classify_gatekeeper.outputs.session_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-session-package-gatekeeper
          retention-days: 14
          if-no-files-found: error

      - name: Post Claude gatekeeper result to issue
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          TASK_ID: ${{ inputs.task_id }}
          ROLE_NAME: gatekeeper
          STEP_OUTCOME: ${{ steps.claude_gatekeeper.outcome }}
          EXECUTION_FILE: ${{ steps.claude_gatekeeper.outputs.execution_file }}
          RUNTIME_FILE: ${{ runner.temp }}/claude-runtime-gatekeeper.json
          RUNTIME_ERROR_TYPE: ${{ steps.classify_gatekeeper.outputs.error_type }}
          RATE_LIMIT_STATUS: ${{ steps.classify_gatekeeper.outputs.rate_limit_status }}
          RATE_LIMIT_TYPE: ${{ steps.classify_gatekeeper.outputs.rate_limit_type }}
          RESET_AT_EPOCH: ${{ steps.classify_gatekeeper.outputs.reset_at_epoch }}
          RESET_AT: ${{ steps.classify_gatekeeper.outputs.reset_at }}
          CLAUDE_SESSION_ID: ${{ steps.classify_gatekeeper.outputs.session_id }}
          RESUME_GENERATION: ${{ inputs.resume_generation }}
          SESSION_UPLOAD_OUTCOME: ${{ steps.upload_gatekeeper.outcome }}
          SESSION_ARTIFACT_NAME: claude-session-${{ steps.classify_gatekeeper.outputs.session_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail

          if [ "$RUNTIME_ERROR_TYPE" = "claude_rate_limit" ]; then
            BODY_FILE="$(mktemp)"
            RESUME_AVAILABLE="false"
            if [ "$SESSION_UPLOAD_OUTCOME" = "success" ]; then
              RESUME_AVAILABLE="true"
            fi
            DIAGNOSTIC_TEXT="$(python - "$RUNTIME_FILE" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(str(data.get('diagnostic_text') or 'Claude reported a usage/session limit.'))
          PY
            )"
            {
              echo "## CLAUDE_EXPERIMENT_ERROR"
              echo
              echo "experiment_id: $EXPERIMENT_ID"
              echo "task_id: $TASK_ID"
              echo "role: $ROLE_NAME"
              echo "workflow_run: $RUN_URL"
              echo "source_run_id: $SOURCE_RUN_ID"
              echo "step_outcome: $STEP_OUTCOME"
              echo "outcome: paused"
              echo "error_type: claude_rate_limit"
              echo "rate_limit_status: ${RATE_LIMIT_STATUS:-rejected}"
              [ -z "${RATE_LIMIT_TYPE:-}" ] || echo "rate_limit_type: $RATE_LIMIT_TYPE"
              [ -z "${RESET_AT_EPOCH:-}" ] || [ "$RESET_AT_EPOCH" = "0" ] || echo "reset_at_epoch: $RESET_AT_EPOCH"
              [ -z "${RESET_AT:-}" ] || echo "reset_at: $RESET_AT"
              echo "session_id: $CLAUDE_SESSION_ID"
              echo "resume_generation: ${RESUME_GENERATION:-0}"
              echo "resume_available: $RESUME_AVAILABLE"
              if [ "$RESUME_AVAILABLE" = "true" ]; then
                echo "session_artifact: $SESSION_ARTIFACT_NAME"
              fi
              echo
              echo "### Error"
              echo
              printf '%s\n' "$DIAGNOSTIC_TEXT"
            } > "$BODY_FILE"
            gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" -F body=@"$BODY_FILE"
            exit 0
          fi

          RESULT_FILE="$(mktemp)"

          python - "$EXECUTION_FILE" "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          execution_file_value = str(sys.argv[1] or "").strip()
          result_file = pathlib.Path(sys.argv[2])

          result = ""
          turns = 0
          last_subtype = ""
          terminal_subtype = ""

          if execution_file_value:
              execution_file = pathlib.Path(execution_file_value)

              if execution_file.exists():
                  raw = execution_file.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )

                  events = []

                  try:
                      data = json.loads(raw)

                      if isinstance(data, list):
                          events = data

                      elif isinstance(data, dict):
                          events = [data]

                  except json.JSONDecodeError:
                      for line in raw.splitlines():
                          try:
                              item = json.loads(line)
                          except json.JSONDecodeError:
                              continue

                          if isinstance(item, dict):
                              events.append(item)

                  for item in events:
                      if not isinstance(item, dict):
                          continue

                      subtype = str(item.get("subtype") or "").strip()

                      if subtype:
                          last_subtype = subtype

                      if subtype == "error_max_turns":
                          terminal_subtype = subtype

                      try:
                          candidate_turns = int(
                              item.get("num_turns") or 0
                          )
                      except (TypeError, ValueError):
                          candidate_turns = 0

                      if candidate_turns > turns:
                          turns = candidate_turns

                      is_result_event = (
                          item.get("type") == "result"
                          or len(events) == 1
                      )

                      if not is_result_event:
                          continue

                      candidate_result = str(
                          item.get("result") or ""
                      )

                      is_error_result = (
                          bool(item.get("is_error"))
                          or subtype.startswith("error_")
                      )

                      if (
                          candidate_result.strip()
                          and not is_error_result
                      ):
                          result = candidate_result

          result_file.write_text(
              json.dumps(
                  {
                      "result": result,
                      "turns": turns,
                      "subtype": terminal_subtype or last_subtype,
                  }
              ),
              encoding="utf-8",
          )
          PY

          RESULT_TEXT="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(str(data.get("result") or ""))
          PY
          )"

          TURNS="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(int(data.get("turns") or 0))
          PY
          )"

          SUBTYPE="$(python - "$RESULT_FILE" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(
              pathlib.Path(sys.argv[1]).read_text(
                  encoding="utf-8"
              )
          )

          print(str(data.get("subtype") or ""))
          PY
          )"

          if [ -n "$(printf '%s' "$RESULT_TEXT" | tr -d '[:space:]')" ]; then
            BODY="$(cat <<EOF
          ## CLAUDE_EXPERIMENT_RESULT

          experiment_id: $EXPERIMENT_ID
          task_id: $TASK_ID
          role: $ROLE_NAME
          workflow_run: $RUN_URL
          agent_profile_id: $SEO_AGENT_PROFILE_ID
          seo_skills_enabled: false
          seo_skills_version: none
          seo_skills_source: none
          seo_skills_release_commit: none

          ### Result

          $RESULT_TEXT
          EOF
          )"

          elif [ "$SUBTYPE" = "error_max_turns" ] \
            || [ "${TURNS:-0}" -ge "$MAX_TURNS" ]; then

            BODY="$(cat <<EOF
          ## CLAUDE_EXPERIMENT_ERROR

          experiment_id: $EXPERIMENT_ID
          task_id: $TASK_ID
          role: $ROLE_NAME
          workflow_run: $RUN_URL
          agent_profile_id: $SEO_AGENT_PROFILE_ID
          seo_skills_enabled: false
          seo_skills_version: none
          seo_skills_source: none
          seo_skills_release_commit: none
          step_outcome: $STEP_OUTCOME
          error_type: turn_limit_exhausted
          turns: $TURNS
          max_turns: $MAX_TURNS

          ### Error

          Claude reached the configured max_turns without producing a valid final result.
          EOF
          )"

          else
            BODY="$(cat <<EOF
          ## CLAUDE_EXPERIMENT_ERROR

          experiment_id: $EXPERIMENT_ID
          task_id: $TASK_ID
          role: $ROLE_NAME
          workflow_run: $RUN_URL
          agent_profile_id: $SEO_AGENT_PROFILE_ID
          seo_skills_enabled: false
          seo_skills_version: none
          seo_skills_source: none
          seo_skills_release_commit: none
          step_outcome: $STEP_OUTCOME
          error_type: claude_execution_error
          turns: $TURNS
          max_turns: $MAX_TURNS

          ### Error

          Claude did not produce a usable final result text. Do not treat this as a valid proposal, gatekeeper review, or implementation result.
          EOF
          )"
          fi

          gh api \
            -X POST \
            "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -f body="$BODY"

  implementation:
    name: Claude implementation role
    needs: validate-inputs
    if: ${{ inputs.dry_run != true && inputs.role == 'implementation' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download interrupted Claude session
        if: ${{ inputs.resume_session_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.resume_artifact_name }}
          path: ${{ runner.temp }}/claude-session-restore
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_source_run_id }}

      - name: Restore interrupted Claude session
        if: ${{ inputs.resume_session_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py restore \
            --session-id "${{ inputs.resume_session_id }}" \
            --input-dir "${RUNNER_TEMP}/claude-session-restore"

      - name: Prepare pinned Claude SEO marketplace
        shell: bash
        run: |
          set -euo pipefail

          MARKETPLACE_DIR="${RUNNER_TEMP}/claude-seo-marketplace"

          git clone \
            --quiet \
            --branch "${SEO_SKILLS_VERSION}" \
            --depth 1 \
            "https://github.com/${SEO_SKILLS_SOURCE}.git" \
            "${MARKETPLACE_DIR}"

          ACTUAL_COMMIT="$(git -C "${MARKETPLACE_DIR}" rev-parse HEAD)"

          if [ "${ACTUAL_COMMIT}" != "${SEO_SKILLS_RELEASE_COMMIT}" ]; then
            echo "Pinned Claude SEO release commit mismatch." >&2
            echo "Expected: ${SEO_SKILLS_RELEASE_COMMIT}" >&2
            echo "Actual:   ${ACTUAL_COMMIT}" >&2
            exit 1
          fi

          echo "Claude SEO marketplace verified:"
          echo "  version: ${SEO_SKILLS_VERSION}"
          echo "  commit:  ${ACTUAL_COMMIT}"

      - name: Run Claude implementation
        id: claude_implementation
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ vars.CLAUDE_VERBOSE_LOGGING == 'true' }}

          plugin_marketplaces: |
            ${{ runner.temp }}/claude-seo-marketplace

          plugins: |
            claude-seo@agricidaniel-claude-seo

          additional_permissions: |
            actions: read
            checks: read

          prompt: |
            REPOSITORY: ${{ github.repository }}
            EXPERIMENT_ID: ${{ inputs.experiment_id }}
            TASK_ID: ${{ inputs.task_id }}
            ISSUE_NUMBER: ${{ inputs.issue_number }}
            ROLE: implementation
            PERMISSION_PROFILE: ${{ inputs.permission_profile }}
            AGENT_PROFILE_ID: ${{ env.SEO_AGENT_PROFILE_ID }}
            SEO_SKILLS_ENABLED: true
            SEO_SKILLS_VERSION: ${{ env.SEO_SKILLS_VERSION }}
            SEO_SKILLS_SOURCE: ${{ env.SEO_SKILLS_SOURCE }}
            SEO_SKILLS_RELEASE_COMMIT: ${{ env.SEO_SKILLS_RELEASE_COMMIT }}

            You are running the implementation role for the SEO autopilot system.

            SEO SKILL POLICY:
            - Use the installed Claude SEO skills only to help implement the already-approved proposal correctly.
            - The approved proposal is the scope boundary.
            - Do not introduce additional SEO improvements merely because a skill recommends them.
            - Do not broaden the task into a general SEO audit.
            - Do not rewrite, broaden, replace, or bypass the immutable validation/observation plan.
            - Do not invoke optional external SEO integrations, MCP services, network tools, plugin subagents, or plugin runtime/setup commands.
            - Do not run /seo setup or any claude-seo runtime command.

            Implement only the approved proposal supplied in the prompt.
            Create one focused branch and one pull request when implementation is required.
            Do not merge the pull request.

            User/n8n task instruction:
            ${{ inputs.resume_session_id != '' && 'Continue the interrupted task from the restored Claude session. The prior execution stopped only because a Claude usage/session limit was reached. Continue from the existing work and produce the originally requested final role result. Do not restart completed analysis or implementation.' || inputs.prompt }}

          claude_args: |
            ${{ needs.validate-inputs.outputs.max_turns_arg }}
            ${{ needs.validate-inputs.outputs.model_arg }}
            ${{ needs.validate-inputs.outputs.resume_arg }}
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh:*)"

      - name: Classify Claude implementation runtime outcome
        id: classify_implementation
        if: ${{ always() }}
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude_implementation.outputs.execution_file }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail
          python .github/scripts/claude-runtime.py classify \
            --execution-file "$EXECUTION_FILE" \
            --max-turns "$MAX_TURNS" \
            --json-output "${RUNNER_TEMP}/claude-runtime-implementation.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Package interrupted Claude implementation session
        id: package_implementation
        if: ${{ always() && steps.classify_implementation.outputs.error_type == 'claude_rate_limit' && steps.classify_implementation.outputs.session_id != '' }}
        continue-on-error: true
