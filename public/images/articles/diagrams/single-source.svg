<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Before: four lists of URLs drift apart. After: one route inventory feeds everything">
<title>Before: four lists of URLs drift apart. After: one route inventory feeds everything</title>
<style>
