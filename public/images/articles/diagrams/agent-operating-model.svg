<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Operating model: what I decide, what the agent does, and the guardrails between us">
<title>Operating model: what I decide, what the agent does, and the guardrails between us</title>
<style>
.t{font:600 15px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614} .tb{font:700 17px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614}
.s{font:400 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#55544f} .xs{font:400 12px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6b6a64}
.k{font:700 11px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.08em;fill:#6a3fd6} .big{font:750 30px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614;letter-spacing:-.02em}
.de{font:italic 400 16px Georgia,'Source Serif 4',serif;fill:#161614}
.box{fill:#ffffff;stroke:#d9d6ce;stroke-width:1.5} .bb{fill:#f2edfd;stroke:#c7b8f3;stroke-width:1.5}
.bg{fill:#e9f6ee;stroke:#a7d8b8;stroke-width:1.5} .br{fill:#fdecea;stroke:#f0b3ac;stroke-width:1.5}
.by{fill:#fff6e3;stroke:#ead19a;stroke-width:1.5} .bn{fill:#f4f3ef;stroke:#dedbd3;stroke-width:1.5}
.ln{stroke:#9b998f;stroke-width:1.6;fill:none} .lnb{stroke:#6a3fd6;stroke-width:1.8;fill:none}
.ar{fill:#9b998f} .arb{fill:#6a3fd6} .dot{fill:#6a3fd6} .dotn{fill:#b5b2a9}
.ok{fill:#0f7a3a} .no{fill:#b3261e} .okt{font:700 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f7a3a} .not{font:700 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#b3261e}
.gap{fill:#ffffff;stroke:#6a3fd6;stroke-width:1.5}
.s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .sm{fill:#d4d2cb} .red{fill:#d03b3b} .amb{fill:#e9a21a} .grn{fill:#1f9d55}
@media (prefers-color-scheme: dark) {
.t,.tb,.big,.de{fill:#f0efea} .s{fill:#c4c2ba} .xs{fill:#a29f96} .k{fill:#b8a4ff}
.box{fill:#1d1d1b;stroke:#3b3a35} .bb{fill:#241e38;stroke:#4f418a} .bg{fill:#15291d;stroke:#2f6545}
.br{fill:#331a18;stroke:#7a3b33} .by{fill:#2b2516;stroke:#6b5a2c} .bn{fill:#22211e;stroke:#3b3a35}
.ln{stroke:#7b796f} .ar{fill:#7b796f} .lnb{stroke:#a58cf6} .arb,.dot{fill:#a58cf6} .dotn{fill:#55534c}
.ok,.okt{fill:#5fd08a} .no,.not{fill:#ff8a80} .gap{fill:#1d1d1b;stroke:#a58cf6}
.s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .sm{fill:#4a4944}
}
</style>
<rect x="20" y="20" width="260" height="180" rx="12" class="bb"/>
<text x="40" y="50" class="k" text-anchor="start">I DECIDE</text>
<text x="40" y="72" class="t" text-anchor="start">Direction and risk</text>
<text x="40" y="94" class="s" text-anchor="start">goals and quality rules</text>
<text x="40" y="112" class="s" text-anchor="start">decisions D1–D27, written</text>
<text x="40" y="130" class="s" text-anchor="start">anything touching production data</text>
<text x="40" y="148" class="s" text-anchor="start">budgets per session</text>
<text x="40" y="166" class="s" text-anchor="start">final audits of output</text>
<rect x="310" y="20" width="260" height="180" rx="12" class="box"/>
<text x="330" y="50" class="k" text-anchor="start">THE AGENT DOES</text>
<text x="330" y="72" class="t" text-anchor="start">The engineering</text>
<text x="330" y="94" class="s" text-anchor="start">code, tests, migrations</text>
<text x="330" y="112" class="s" text-anchor="start">experiments within a budget</text>
<text x="330" y="130" class="s" text-anchor="start">reports with numbers</text>
<text x="330" y="148" class="s" text-anchor="start">pull requests for review</text>
<text x="330" y="166" class="s" text-anchor="start">runbooks for my steps</text>
<rect x="600" y="20" width="260" height="180" rx="12" class="bg"/>
<text x="620" y="50" class="k" text-anchor="start">GUARDRAILS</text>
<text x="620" y="72" class="t" text-anchor="start">Shared between us</text>
<text x="620" y="94" class="s" text-anchor="start">roadmap file as memory</text>
<text x="620" y="112" class="s" text-anchor="start">fixture DB in generation sessions</text>
<text x="620" y="130" class="s" text-anchor="start">regression eval before merges</text>
<text x="620" y="148" class="s" text-anchor="start">spend caps, quota = stop</text>
<text x="620" y="166" class="s" text-anchor="start">undo files for data changes</text>
</svg>
