<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Anatomy of one gap: a correct answer, a good distractor, and two flawed ones">
<title>Anatomy of one gap: a correct answer, a good distractor, and two flawed ones</title>
<style>
.t{font:600 15px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614} .tb{font:700 17px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614}
.s{font:400 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#55544f} .xs{font:400 12px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6b6a64}
.k{font:700 11px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.08em;fill:#6a3fd6} .big{font:750 30px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614;letter-spacing:-.02em}
.de{font:italic 400 16px Georgia,'Source Serif 4',serif;fill:#161614}
.box{fill:#ffffff;stroke:#d9d6ce;stroke-width:1.5} .bb{fill:#f2edfd;stroke:#c7b8f3;stroke-width:1.5}
.bg{fill:#e9f6ee;stroke:#a7d8b8;stroke-width:1.5} .br{fill:#fdecea;stroke:#f0b3ac;stroke-width:1.5}
.by{fill:#fff6e3;stroke:#ead19a;stroke-width:1.5} .bn{fill:#f4f3ef;stroke:#dedbd3;stroke-width:1.5}
.ln{stroke:#9b998f;stroke-width:1.6;fill:none} .lnb{stroke:#6a3fd6;stroke-width:1.8;fill:none}
.ar{fill:#9b998f} .arb{fill:#6a3fd6} .dot{fill:#6a3fd6} .dotn{fill:#b5b2a9}
.ok{fill:#0f7a3a} .no{fill:#b3261e} .okt{font:700 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f7a3a} .not{font:700 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#b3261e}
.gap{fill:#ffffff;stroke:#6a3fd6;stroke-width:1.5}
.s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .sm{fill:#d4d2cb} .red{fill:#d03b3b} .amb{fill:#e9a21a} .grn{fill:#1f9d55}
@media (prefers-color-scheme: dark) {
.t,.tb,.big,.de{fill:#f0efea} .s{fill:#c4c2ba} .xs{fill:#a29f96} .k{fill:#b8a4ff}
.box{fill:#1d1d1b;stroke:#3b3a35} .bb{fill:#241e38;stroke:#4f418a} .bg{fill:#15291d;stroke:#2f6545}
.br{fill:#331a18;stroke:#7a3b33} .by{fill:#2b2516;stroke:#6b5a2c} .bn{fill:#22211e;stroke:#3b3a35}
.ln{stroke:#7b796f} .ar{fill:#7b796f} .lnb{stroke:#a58cf6} .arb,.dot{fill:#a58cf6} .dotn{fill:#55534c}
.ok,.okt{fill:#5fd08a} .no,.not{fill:#ff8a80} .gap{fill:#1d1d1b;stroke:#a58cf6}
.s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .sm{fill:#4a4944}
}
</style>
<text x="20" y="34" class="de" text-anchor="start">Am Wochenende treffen wir uns</text>
<rect x="258" y="14" width="88" height="30" rx="8" class="gap"/>
<text x="302" y="34" class="de" text-anchor="middle">?</text>
<text x="358" y="34" class="de" text-anchor="start">Park.</text>
<text x="20" y="60" class="xs" text-anchor="start">“At the weekend we meet ___ the park.” Section: prepositions with dative or accusative (A2).</text>
<rect x="20" y="84" width="840" height="62" rx="10" class="bg"/>
<rect x="36" y="99" width="92" height="32" rx="8" class="box"/>
<text x="82" y="121" class="de" text-anchor="middle">im</text>
<circle cx="152" cy="115" r="9" class="ok"/><path d="M148 115 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="174" y="111" class="t" text-anchor="start">Correct</text>
<text x="174" y="131" class="s" text-anchor="start">Location (wo?) takes the dative: in + dem = im.</text>
<rect x="20" y="156" width="840" height="62" rx="10" class="box"/>
<rect x="36" y="171" width="92" height="32" rx="8" class="box"/>
<text x="82" y="193" class="de" text-anchor="middle">in den</text>
<circle cx="152" cy="187" r="9" class="ok"/><path d="M148 187 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="174" y="183" class="t" text-anchor="start">Good distractor</text>
<text x="174" y="203" class="s" text-anchor="start">One error, inside the target grammar: accusative instead of dative.</text>
<rect x="20" y="228" width="840" height="62" rx="10" class="br"/>
<rect x="36" y="243" width="92" height="32" rx="8" class="box"/>
<text x="82" y="265" class="de" text-anchor="middle">in dem</text>
<circle cx="152" cy="259" r="9" class="no"/><path d="M148.5 255.5 l7 7 M155.5 255.5 l-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="174" y="255" class="t" text-anchor="start">Flawed: a second right answer (G2 / FG1)</text>
<text x="174" y="275" class="s" text-anchor="start">Uncontracted, stiff, but standard German. A strict reader marks it correct.</text>
<rect x="20" y="300" width="840" height="62" rx="10" class="br"/>
<rect x="36" y="315" width="92" height="32" rx="8" class="box"/>
<text x="82" y="337" class="de" text-anchor="middle">bei den</text>
<circle cx="152" cy="331" r="9" class="no"/><path d="M148.5 327.5 l7 7 M155.5 327.5 l-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="174" y="327" class="t" text-anchor="start">Flawed: double error (FG2)</text>
<text x="174" y="347" class="s" text-anchor="start">Wrong preposition and wrong case at once. The learner can’t tell which rule failed.</text>
<text x="20" y="390" class="xs" text-anchor="start">Two more ways a distractor fails: nobody would choose it (FG3), or it tests a different grammar point (G3, FG6).</text>
</svg>
