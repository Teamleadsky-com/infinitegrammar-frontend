<text x="20" y="24" class="k" text-anchor="start">PIPELINE V6 · IN PRODUCTION SINCE 4 OCT 2026</text>
<rect x="20" y="40" width="180" height="122" rx="12" class="bb"/>
<text x="36" y="66" class="k" text-anchor="start">1 · WRITE</text>
<text x="36" y="88" class="t" text-anchor="start">Draft the exercise</text>
<text x="36" y="110" class="s" text-anchor="start">gpt-6.1-sol, from</text>
<text x="36" y="128" class="s" text-anchor="start">section, level, topic</text>
<rect x="230" y="40" width="180" height="122" rx="12" class="box"/>
<text x="246" y="66" class="k" text-anchor="start">2 · RULES</text>
<text x="246" y="88" class="t" text-anchor="start">Free checks</text>
<text x="246" y="110" class="s" text-anchor="start">format, gap count,</text>
<text x="246" y="128" class="s" text-anchor="start">giveaways (G5)</text>
<rect x="440" y="40" width="280" height="122" rx="12" class="box"/>
<text x="456" y="66" class="k" text-anchor="start">3 · SOLVE AND JUDGE</text>
<text x="456" y="88" class="t" text-anchor="start">Exactly one right answer?</text>
<text x="456" y="110" class="s" text-anchor="start">2 solvers must agree (G2)</text>
<text x="456" y="128" class="s" text-anchor="start">judge: German, topic,</text>
<text x="456" y="146" class="s" text-anchor="start">explanations (G1, G3, G4)</text>
<rect x="750" y="40" width="115" height="122" rx="12" class="by"/>
<text x="766" y="66" class="k" text-anchor="start">REPAIR</text>
<text x="766" y="88" class="t" text-anchor="start">Fix only</text>
<text x="766" y="109" class="t" text-anchor="start">failing gaps</text>
<text x="766" y="131" class="s" text-anchor="start">max 2 rounds</text>
<line x1="200" y1="101" x2="230" y2="101" class="ln"/>
<polygon points="230.0,101.0 221.0,96.0 221.0,106.0" class="ar"/>
<line x1="410" y1="101" x2="440" y2="101" class="ln"/>
<polygon points="440.0,101.0 431.0,96.0 431.0,106.0" class="ar"/>
<line x1="720" y1="82" x2="750" y2="82" class="ln"/>
<polygon points="750.0,82.0 741.0,77.0 741.0,87.0" class="ar"/>
<text x="735" y="74" class="xs" text-anchor="middle">fail</text>
<line x1="750" y1="132" x2="720" y2="132" class="ln"/>
<polygon points="720.0,132.0 729.0,137.0 729.0,127.0" class="ar"/>
<text x="735" y="152" class="xs" text-anchor="middle">re-check</text>
<line x1="580" y1="162" x2="580" y2="238" class="ln"/>
<polygon points="580.0,238.0 585.0,229.0 575.0,229.0" class="ar"/>
<text x="590" y="205" class="xs" text-anchor="start">all gap checks pass</text>
<rect x="440" y="238" width="280" height="112" rx="12" class="box"/>
<text x="456" y="264" class="k" text-anchor="start">4 · COHERENCE</text>
<text x="456" y="286" class="t" text-anchor="start">Does the story hold up?</text>
<text x="456" y="308" class="s" text-anchor="start">who does what, references,</text>
<text x="456" y="326" class="s" text-anchor="start">contradictions (G6)</text>
<rect x="230" y="238" width="180" height="112" rx="12" class="box"/>
<text x="246" y="264" class="k" text-anchor="start">5 · EDITOR GATE</text>
<text x="246" y="286" class="t" text-anchor="start">Senior-editor read</text>
<text x="246" y="308" class="s" text-anchor="start">gpt-6.1-sol, issue</text>
<text x="246" y="326" class="s" text-anchor="start">types FG1–FG6</text>
<rect x="20" y="238" width="180" height="112" rx="12" class="bg"/>
<text x="36" y="264" class="k" text-anchor="start">LIVE</text>
<text x="36" y="286" class="t" text-anchor="start">Written as passed</text>
<text x="36" y="308" class="s" text-anchor="start">served to learners</text>
