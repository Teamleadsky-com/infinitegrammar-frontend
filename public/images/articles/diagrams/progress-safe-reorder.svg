<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Progress-safe reordering: completed exercises stay in front, only the tail is reordered">
<title>Progress-safe reordering: completed exercises stay in front, only the tail is reordered</title>
<style>
.t{font:600 15px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614} .tb{font:700 17px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614}
.s{font:400 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#55544f} .xs{font:400 12px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6b6a64}
.k{font:700 11px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.08em;fill:#6a3fd6} .big{font:750 30px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#161614;letter-spacing:-.02em}
.de{font:italic 400 16px Georgia,'Source Serif 4',serif;fill:#161614}
.box{fill:#ffffff;stroke:#d9d6ce;stroke-width:1.5} .bb{fill:#f2edfd;stroke:#c7b8f3;stroke-width:1.5}
.bg{fill:#e9f6ee;stroke:#a7d8b8;stroke-width:1.5} .br{fill:#fdecea;stroke:#f0b3ac;stroke-width:1.5}
.by{fill:#fff6e3;stroke:#ead19a;stroke-width:1.5} .bn{fill:#f4f3ef;stroke:#dedbd3;stroke-width:1.5}
.ln{stroke:#9b998f;stroke-width:1.6;fill:none} .lnb{stroke:#6a3fd6;stroke-width:1.8;fill:none}
.ar{fill:#9b998f} .arb{fill:#6a3fd6} .dot{fill:#6a3fd6} .dotn{fill:#b5b2a9}
.ok{fill:#0f7a3a} .no{fill:#b3261e} .okt{font:700 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f7a3a} .not{font:700 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#b3261e}
.gap{fill:#ffffff;stroke:#6a3fd6;stroke-width:1.5}
.s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .sm{fill:#d4d2cb} .red{fill:#d03b3b} .amb{fill:#e9a21a} .grn{fill:#1f9d55}
@media (prefers-color-scheme: dark) {
.t,.tb,.big,.de{fill:#f0efea} .s{fill:#c4c2ba} .xs{fill:#a29f96} .k{fill:#b8a4ff}
.box{fill:#1d1d1b;stroke:#3b3a35} .bb{fill:#241e38;stroke:#4f418a} .bg{fill:#15291d;stroke:#2f6545}
.br{fill:#331a18;stroke:#7a3b33} .by{fill:#2b2516;stroke:#6b5a2c} .bn{fill:#22211e;stroke:#3b3a35}
.ln{stroke:#7b796f} .ar{fill:#7b796f} .lnb{stroke:#a58cf6} .arb,.dot{fill:#a58cf6} .dotn{fill:#55534c}
.ok,.okt{fill:#5fd08a} .no,.not{fill:#ff8a80} .gap{fill:#1d1d1b;stroke:#a58cf6}
.s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .sm{fill:#4a4944}
}
</style>
<rect x="20" y="40" width="60" height="60" rx="10" class="bn"/>
<text x="50" y="76" class="t" text-anchor="middle">1</text>
<text x="50" y="118" class="xs" text-anchor="middle">done</text>
<rect x="90" y="40" width="60" height="60" rx="10" class="bn"/>
<text x="120" y="76" class="t" text-anchor="middle">2</text>
<text x="120" y="118" class="xs" text-anchor="middle">done</text>
<rect x="160" y="40" width="60" height="60" rx="10" class="bn"/>
<text x="190" y="76" class="t" text-anchor="middle">3</text>
<text x="190" y="118" class="xs" text-anchor="middle">done</text>
<rect x="230" y="40" width="60" height="60" rx="10" class="bn"/>
<text x="260" y="76" class="t" text-anchor="middle">4</text>
<text x="260" y="118" class="xs" text-anchor="middle">done</text>
<rect x="300" y="40" width="60" height="60" rx="10" class="bn"/>
<text x="330" y="76" class="t" text-anchor="middle">5</text>
<text x="330" y="118" class="xs" text-anchor="middle">done</text>
<rect x="370" y="40" width="60" height="60" rx="10" class="bb"/>
<text x="400" y="76" class="t" text-anchor="middle">6</text>
<rect x="440" y="40" width="60" height="60" rx="10" class="bb"/>
<text x="470" y="76" class="t" text-anchor="middle">7</text>
<rect x="510" y="40" width="60" height="60" rx="10" class="bb"/>
<text x="540" y="76" class="t" text-anchor="middle">8</text>
<rect x="580" y="40" width="60" height="60" rx="10" class="bb"/>
<text x="610" y="76" class="t" text-anchor="middle">9</text>
<rect x="650" y="40" width="60" height="60" rx="10" class="bb"/>
<text x="680" y="76" class="t" text-anchor="middle">10</text>
<rect x="720" y="40" width="60" height="60" rx="10" class="bb"/>
<text x="750" y="76" class="t" text-anchor="middle">11</text>
<rect x="790" y="40" width="60" height="60" rx="10" class="bb"/>
<text x="820" y="76" class="t" text-anchor="middle">12</text>
<line x1="365" y1="28" x2="365" y2="150" class="lnb" stroke-dasharray="4 4"/>
<text x="20" y="24" class="xs" text-anchor="start">Completed by at least one learner: frozen, in the old order</text>
<text x="380" y="24" class="xs" text-anchor="start">Nobody has seen these yet: free to reorder</text>
<line x1="395" y1="150" x2="395" y2="108" class="lnb"/>
<polygon points="395.0,108.0 390.0,117.0 400.0,117.0" class="arb"/>
<text x="410" y="160" class="s" text-anchor="start">The first free exercise is the one least similar to the last frozen one,</text>
<text x="410" y="180" class="s" text-anchor="start">because that is exactly where a returning learner continues.</text>
<text x="20" y="225" class="s" text-anchor="start">Learner pointers are remapped in the same database transaction as the new order numbers.</text>
</svg>
