<!doctype html>
<html lang="de">
  <head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-E1DX6F9ZLP');
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deutsche Grammatik üben A1-C1: Lückentext-Übungen für telc & TestDaF | InfiniteGrammar</title>
    <!-- OG/Twitter/description tags are injected by React Helmet per page. Do NOT add them here — duplicates cause LinkedIn/social crawlers to read the wrong values. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hidden form for Netlify to detect at build time -->
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="exercisesCompleted" />
    </form>

    <!-- Hidden form for tracking waitlist popup opens -->
    <form name="waitlist-popup-open" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="timestamp" />
      <input type="text" name="source" />
      <input type="text" name="exercisesCompleted" />
      <input type="text" name="sessionId" />
    </form>

    <!-- Hidden form for coming soon waitlist (maintenance mode) -->
    <form name="coming-soon-waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="timestamp" />
    </form>
  </body>
